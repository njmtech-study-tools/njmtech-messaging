name: Release

# Push a tag like v1.2.3 to build and publish:
#   - signed Android APK + AAB
#   - Linux AppImage
#   - Windows installer (NSIS)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing a release (e.g. 0.2.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Repository variable: the deployed Worker origin, e.g. https://njm-messaging.example.workers.dev
  VITE_API_URL: ${{ vars.API_URL }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          NAME="${RAW#v}"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$RAW' is not MAJOR.MINOR.PATCH"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the repository variable API_URL to your deployed Worker origin"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Write Firebase config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the APK will build but push notifications won't work"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/client/android/app/google-services.json
          fi

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see scripts/gen-android-keystore.sh)"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build web assets and sync Capacitor
        run: pnpm --filter @njm/client android:sync

      - name: Build signed APK and AAB
        working-directory: apps/client/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signature and collect artifacts
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=apps/client/android/app/build/outputs/apk/release/app-release.apk
          AAB=apps/client/android/app/build/outputs/bundle/release/app-release.aab
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/Ephemeral-${VERSION_NAME}.apk"
          cp "$AAB" "out/Ephemeral-${VERSION_NAME}.aab"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  desktop:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage deb
          - os: windows-latest
            target: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web assets and Electron main
        run: pnpm --filter @njm/desktop build

      - name: Package
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Windows code signing (removes the SmartScreen warning):
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD && export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder ${{ matrix.target }} --publish never \
            -c.extraMetadata.version=${{ needs.version.outputs.name }} \
            -c.extraMetadata.homepage=${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Ephemeral ${{ needs.version.outputs.name }}
          generate_release_notes: true
          files: dist/*
